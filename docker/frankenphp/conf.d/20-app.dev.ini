; Remit — development (and stage) settings.
; Templates are edited live during the talk: opcache must see file changes immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug is installed but off: `make xdebug` restarts the container with XDEBUG_MODE=debug.
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
