# Remit — iOS shell (Hotwire Native). The Xcode project is generated from this file:
#
#   make ios        (from the Symfony project root — or: ./native/ios/generate.sh)
#
# Needs Xcode 16+ and XcodeGen (brew install xcodegen). The generated Remit.xcodeproj is not committed.
name: Remit

options:
  bundleIdPrefix: com.bludevon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Remit.xcconfig
  Release: Config/Remit.xcconfig

packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    from: 1.3.1

targets:
  Remit:
    type: application
    platform: iOS
    sources:
      - path: Remit
    dependencies:
      - package: HotwireNative
    info:
      path: Remit/Info.plist
      properties:
        CFBundleDisplayName: Remit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Light only, like the web app: in Dark Mode the title bar text turns white over the light pages.
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # Plain HTTP to the Mac (http://<name>.local, http://localhost) — local network only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Required by <input type="file" accept="image/*" capture>: without it the app crashes on the photo zone.
        NSCameraUsageDescription: Remit uses the camera to photograph your receipts.
        NSPhotoLibraryUsageDescription: Remit lets you pick a receipt photo from your library.
        # Asked once by iOS before talking to the Mac on the local network.
        NSLocalNetworkUsageDescription: Remit connects to the expense server running on your Mac.
        RemitServerHost: $(REMIT_SERVER_HOST)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMIT_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(REMIT_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
